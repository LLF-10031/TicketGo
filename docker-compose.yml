version: "3.8"

# TicketGo 基础设施（Docker Desktop）
# 启动：docker compose up -d
# 端口：MySQL 3307 / Redis 6379 / Kafka 9092 / MinIO 9000(API)+9001(Console) / Nacos 8848 / Seata 8091+7091
services:
  mysql:
    image: mysql:8.0
    container_name: ticketgo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ticketgo
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ticketgo-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ticketgo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ticketgo-redis-data:/data

  kafka:
    image: quay.io/strimzi/kafka:0.45.0-kafka-3.8.1
    container_name: ticketgo-kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    command:
      - bash
      - -c
      - |
        export CLUSTER_ID=$$(bin/kafka-storage.sh random-uuid)
        bin/kafka-storage.sh format -t $$CLUSTER_ID -c config/kraft/server.properties
        bin/kafka-server-start.sh config/kraft/server.properties
    volumes:
      - ticketgo-kafka-data:/tmp/kraft-combined-logs

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: ticketgo-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ticketgo-minio-data:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ticketgo-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ticketgo-nacos-data:/home/nacos/data

  seata:
    image: seataio/seata-server:2.0.0
    container_name: ticketgo-seata
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_IP: host.docker.internal
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SEATA_PORT: "8091"
    depends_on:
      - nacos

volumes:
  ticketgo-mysql-data:
  ticketgo-redis-data:
  ticketgo-kafka-data:
  ticketgo-minio-data:
  ticketgo-nacos-data:
