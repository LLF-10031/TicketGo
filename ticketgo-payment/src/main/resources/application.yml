server:
  port: 8088

spring:
  application:
    name: ticketgo-payment
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/ticketgo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${TICKETGO_DB_PASSWORD:root123456}
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

ticketgo:
  order:
    base-url: http://127.0.0.1:8085

logging:
  level:
    com.ticketgo: debug

# ---- Seata（默认关闭，使用 --spring.profiles.active=seata 启用�?---
seata:
  enabled: false
---
spring:
  config:
    activate:
      on-profile: seata
seata:
  enabled: true
  application-id: ticketgo-payment
  tx-service-group: ticketgo-tx-group
  service:
    vgroup-mapping:
      ticketgo-tx-group: default
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      application: seata-server
      group: DEFAULT_GROUP
