<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketGo · 演出详情</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo"><span class="dot"></span>TicketGo</div>
      <div class="search"><input placeholder="搜索演出、艺人、场馆"><button>搜索</button></div>
      <div class="header-right">
        <span class="icon">我的订单</span>
        <span class="icon">优惠券</span>
        <div class="avatar-wrap">
          <div class="avatar">明</div>
          <div class="dropdown">
            <div class="dropdown-head"><div class="avatar">明</div><div><div class="name">小明</div><div class="sub">订单 3 · 券 2</div></div></div>
            <a href="#">个人中心</a><a href="orders.html">我的订单</a><a href="#">我的券包</a><a href="login.html" class="logout">退出登录</a>
          </div>
        </div>
      </div>
    </div>
  </header>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html">首页</a><a href="#" class="active">演唱会</a><a href="#">话剧歌剧</a><a href="#">体育赛事</a><a href="#">展览休闲</a>
    </div>
  </nav>

  <div class="container">
    <div class="detail-top">
      <div class="detail-poster"></div>
      <div class="detail-info">
        <h1>周杰伦「嘉年华」世界巡回演唱会 · 北京站</h1>
        <div class="meta">
          <div>📍 北京 · 国家体育场（鸟巢）</div>
          <div>🕐 2026-06-20 19:30</div>
          <div>🎫 开票时间：2026-01-01 20:00</div>
          <div>🔥 <span class="tag">热卖中</span> <span class="tag gray">实名购票</span></div>
        </div>
      </div>
    </div>

    <div class="section-title"><h2>选择场次与票档</h2></div>
    <div style="display:flex; gap:10px; margin-bottom:16px;">
      <span class="tag">2026-06-20 19:30</span>
      <span class="tag gray">2026-06-21 19:30</span>
      <span class="tag gray">2026-06-22 19:30</span>
    </div>

    <div class="tier-row"><div><b>看台票</b> <span class="tag">余票充足</span></div><div class="price">¥580</div></div>
    <div class="tier-row"><div><b>内场票</b> <span class="tag">仅剩 30 张</span></div><div class="price">¥980</div></div>
    <div class="tier-row"><div><b>VIP 票</b> <span class="tag gray">含周边礼包</span></div><div class="price">¥1580</div></div>

    <div class="buybar">
      <button class="btn btn-primary" style="flex:1">免选座抢票</button>
      <button class="btn btn-ghost" style="flex:1">选座购票</button>
    </div>

    <div class="footer">TicketGo 演出票务平台 · 原型演示</div>
  </div>
</body>
</html>
